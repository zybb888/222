name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libglew-dev x11proto-core-dev libx11-dev libxxf86vm-dev libgl1-mesa-dev python3-setuptools libfreetype6-dev libpng-dev libjpeg-dev fonts-noto-cjk wget curl ca-certificates
        sudo apt-get clean

    - name: 验证 Java 版本
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    - name: 安装 Buildozer 和 Cython
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade cython==0.29.36
        pip install buildozer==1.5.0
        buildozer --version

    - name: 验证项目文件
      run: |
        ls -la
        cat buildozer.spec
        head -20 main.py

    - name: 构建 APK
      run: |
        buildozer android clean 2>/dev/null || true
        buildozer android debug

    - name: 验证 APK 文件
      if: always()
      run: |
        find . -name "*.apk" -type f 2>/dev/null || echo "未找到 APK 文件"
        ls -la bin/ 2>/dev/null || echo "bin 目录不存在"

    - name: 上传 APK 文件
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Iqiyi-Helper-APK
        path: bin/*.apk
        retention-days: 30
