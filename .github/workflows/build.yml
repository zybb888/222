name: Build APK

on:
  push:
    branches: [ main ] # 当你推送代码时触发
  workflow_dispatch:   # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: 安装系统依赖 (Android SDK/NDK)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        # 安装 buildozer 的依赖
        pip install buildozer

    - name: 初始化 Buildozer
      run: |
        # 确保 spec 文件存在且权限正确
        ls -la
        buildozer android clean

    - name: 构建 APK (Debug 版本)
      run: |
        # -v 表示显示详细日志，方便排错
        # debug 表示构建调试版，不需要签名，可以直接安装测试
        buildozer -v android debug

    - name: 上传 APK 文件
      uses: actions/upload-artifact@v4
      with:
        name: Iqiyi-Helper-APK
        path: bin/*.apk
