name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv build-essential \
            libffi-dev libssl-dev autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            liblzma-dev libsqlite3-dev libbz2-dev \
            libreadline-dev libgdbm-dev tk-dev \
            openjdk-17-jdk unzip zip git

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        timeout-minutes: 60
        env:
          BUILDOZER_WARN_ROOT_CONFIG: 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqiyi-claim-apk
          path: bin/*.apk
