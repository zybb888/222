name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            libunwind-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            zip \
            unzip \
            ant

      - name: Install Buildozer and Cython
        run: |
          # 必须安装 Cython 3.0+ 以修复 Python 3.13+ 环境下 cgi 模块缺失导致的编译失败
          pip install --upgrade buildozer "cython>=3.0.0" virtualenv setuptools

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
        env:
          BUILDOZER_WARN_ROOT_CONFIG: 1
          BUILDOZER_ALLOW_ORG_APK_EXPORT: 1
          # 核心修复：强制子编译环境使用 Cython 3.0.0
          APP_CYTHON_VERSION: "3.0.0"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqiyi-claim-apk
          path: bin/*.apk
