name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 清理空间 (防止编译过程中因磁盘满而中断)
      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/local/lib/android # 移除旧版SDK以释放约20GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 安装系统依赖 (精简版，移除冲突的库)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            libunwind-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            zip \
            unzip \
            ant

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade buildozer cython==0.29.33 virtualenv

      # 3. 编译阶段 (显式设置环境变量防止卡死)
      - name: Build APK with Buildozer
        run: |
          # 自动接受所有许可协议
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ROOT_CONFIG: 1
          BUILDOZER_ALLOW_ORG_APK_EXPORT: 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqiyi-claim-apk
          path: bin/*.apk
