name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 Java 17 (这是解决之前 Gradle 报错的关键)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 安装系统依赖 (Ubuntu 22.04/24.04 编译 Python 所需)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3 \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ant \
            openjdk-17-jdk

      # 3. 安装 Buildozer 和 Cython
      - name: Install Buildozer and Cython
        run: |
          pip3 install --user --upgrade buildozer cython virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. 执行编译 (直接使用 buildozer 命令，避免第三方 Action 失效的问题)
      - name: Build APK
        run: |
          buildozer android debug
        env:
          BUILDOZER_WARN_ROOT_CONFIG: 1
          # 自动同意 SDK 协议
          BUILDOZER_ALLOW_ORG_APK_EXPORT: 1

      # 5. 上传生成的 APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqiyi-claim-apk
          path: bin/*.apk
